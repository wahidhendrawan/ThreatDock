services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threatdock}
      POSTGRES_USER: ${POSTGRES_USER:-threatdock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatdock_change_me}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-threatdock}
      PGUSER: ${POSTGRES_USER:-threatdock}
      PGPASSWORD: ${POSTGRES_PASSWORD:-threatdock_change_me}
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
