name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feat', 'feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['fix', 'bugfix', 'bug']
  - title: '🧰 Maintenance'
    labels: ['chore', 'ci', 'dependencies', 'refactor']
change-template: '- $TITLE (#$NUMBER)'
version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'feature']
  patch:
    labels: ['patch', 'fix', 'chore', 'dependencies']
  default: patch
template: |
  ## Changes
  $CHANGES
