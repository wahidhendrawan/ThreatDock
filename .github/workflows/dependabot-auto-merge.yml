name: Dependabot Auto-Merge

# Merges Dependabot's grouped minor/patch PRs after the "CI" workflow succeeded on their
# current commit. Major updates are separate PRs and stay open for a human. The merge uses
# GITHUB_TOKEN, which does not start push-triggered workflows (pages, release, deploy);
# those run on the next human push.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      contains(github.event.workflow_run.head_branch, '/minor-and-patch-')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the grouped update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,headRefOid \
                --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH at $SHA (already merged, or Dependabot pushed a newer commit)"
            exit 0
          fi
          # With branch protection, --auto waits for the remaining required checks; without it, merge now.
          gh pr merge --repo "$REPO" --squash --auto "$pr" || gh pr merge --repo "$REPO" --squash "$pr"
