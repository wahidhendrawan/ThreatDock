name: E2E Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-smoke-password
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          mkdir -p backend
          if [ ! -f backend/.env ]; then
            cat > backend/.env <<EOF
          POSTGRES_DB=threatdock
          POSTGRES_USER=threatdock
          POSTGRES_PASSWORD=ci-smoke-password
          AUTH_PASSWORD=ci-smoke-admin-password
          JWT_SECRET=ci-smoke-test-secret
          EOF
          fi

      - name: Build and start stack
        run: docker compose up -d --build postgres redis backend frontend

      - name: Wait for backend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5002/ >/dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not respond within 180s"
          docker compose logs backend | tail -80
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              echo "Frontend ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Frontend did not respond within 60s"
          docker compose logs frontend | tail -50
          exit 1

      - name: Smoke check - health and observability endpoints
        run: |
          echo "=== Backend root ==="
          curl -fsS http://localhost:5002/
          echo ""
          echo "=== Liveness and readiness ==="
          test "$(curl -fsS http://localhost:5002/healthz)" = "OK"
          test "$(curl -fsS http://localhost:5002/readyz)" = "OK"
          echo "=== Prometheus metrics ==="
          curl -fsS http://localhost:5002/metrics | grep -q '^# HELP threatdock_http_requests_total'
          echo "=== Auth config (unauthenticated) ==="
          curl -fsS http://localhost:5002/auth/config | head -c 200
          echo ""

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run critical browser flows
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_USERNAME: threatdock
          E2E_PASSWORD: ci-smoke-admin-password
        working-directory: frontend
        run: npm run test:e2e

      - name: Run read API performance baseline
        env:
          PERF_BASE_URL: http://localhost:5002
          PERF_REQUESTS: 30
          PERF_CONCURRENCY: 5
          PERF_MAX_P95_MS: 500
          PERF_MAX_ERROR_RATE: 0.01
          PERF_ENFORCE_THRESHOLDS: "true"
        run: |
          PERF_AUTH_TOKEN="$(node -e '
            fetch("http://localhost:5002/auth/local-login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: "threatdock", password: "ci-smoke-admin-password" })
            })
              .then(async response => {
                const payload = await response.json();
                if (!response.ok || !payload.access_token) throw new Error(payload.error || `Login failed (${response.status})`);
                process.stdout.write(payload.access_token);
              })
              .catch(error => { console.error(error.message); process.exit(1); });
          ')"
          export PERF_AUTH_TOKEN
          node scripts/benchmark-api.js

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs backend | tail -100
          docker compose logs frontend | tail -50

      - name: Teardown
        if: always()
        run: docker compose down -v
