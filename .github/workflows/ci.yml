name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create env files for validation
        run: |
          find . -name '*.env.example' -exec sh -c 'cp "$1" "${1%.example}"' _ {} \;
          find . -name 'docker-compose.yml' -exec dirname {} \; | while read d; do
            touch "$d/.env" 2>/dev/null || true
          done
          touch backend/.env frontend/.env 2>/dev/null || true
      - run: docker compose config --quiet
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint frontend
        working-directory: frontend
        run: |
          [ -f package.json ] && npm install && npm run lint --if-present || echo "skip"
      - name: Lint backend
        working-directory: backend
        run: |
          [ -f package.json ] && npm install && npm run lint --if-present || echo "skip"
